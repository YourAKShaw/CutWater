# Codex UI metadata and invocation policy. Other clients ignore this file.
# To make cutwater explicit-only in Codex, set allow_implicit_invocation: false.
interface:
  display_name: "cutwater"
  short_description: "Issue-first GitHub workflow: audit and set up a repo, then issue → branch → commits → PR you merge"
  default_prompt: "Use $cutwater to audit this repository's setup, then start my next task issue-first."
policy:
  allow_implicit_invocation: true
