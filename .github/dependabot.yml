version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tooling:
        patterns: ["*"]
    ignore:
      # typescript-eslint allows only typescript <6.1, and TypeScript 7.0 ships
      # no programmatic API (#34). Remove this rule once
      # `npm view typescript-eslint peerDependencies.typescript` allows 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
