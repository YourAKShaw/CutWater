name: ✨ Improvement
description: Propose a new rule, phase, template, helper command or stack.
title: "✨ feat: "
labels: ["type: feat"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The concrete situation where cutwater falls short today. Real transcripts or repository states help most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and which files it touches (SKILL.md, a reference, an asset, the helper).
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and safety
      description: Does it add a write, a gate, a token scope, or context cost? How does it keep the hard rules (never merge, gates, diff before overwrite)?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How to verify
      description: A test, fixture or eval scenario that would prove it works.
    validations:
      required: false
