name: 📊 Eval run
description: Report results from running the scenario or triggering evals.
title: "📊 test: eval run "
labels: ["type: test"]
body:
  - type: markdown
    attributes:
      value: |
        Follow [evals/README.md](https://github.com/YourAKShaw/CutWater/blob/HEAD/evals/README.md). Report results as observed, whichever way they point.
  - type: input
    id: setup
    attributes:
      label: Skill version, host and models
      placeholder: v0.1.0 · Claude Code 2.x · sonnet-class, opus-class
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of `node scripts/evals.ts report results.json`
      render: text
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Deviations from the protocol
      description: Fewer runs, other fixtures, changed judge prompt, no human spot-check, and so on. Write "None" if you followed it exactly.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Notable failures
      description: Short excerpts (sanitised) of runs that failed, and which rule they broke.
    validations:
      required: false
